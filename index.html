<!doctype html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AliZoVoX × NekoHiRaN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f8f7ff;font-family:Inter,Vazirmatn,Segoe UI,Tahoma,sans-serif;background:#05050b;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:48px 48px}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 17% 27%,#35b8ff25,transparent 31%),radial-gradient(circle at 84% 22%,#ff64c925,transparent 30%),radial-gradient(circle at 50% 105%,#7658ff20,transparent 40%)}
.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none}.petals i{position:absolute;width:8px;height:12px;border-radius:70% 30% 70% 30%;background:#ffb1df9c;animation:fall linear infinite}.petals i:nth-child(1){left:7%;animation-duration:12s}.petals i:nth-child(2){left:22%;animation-duration:15s;animation-delay:3s}.petals i:nth-child(3){left:38%;animation-duration:13s;animation-delay:6s}.petals i:nth-child(4){left:57%;animation-duration:16s;animation-delay:1s}.petals i:nth-child(5){left:75%;animation-duration:14s;animation-delay:4s}.petals i:nth-child(6){left:91%;animation-duration:17s;animation-delay:7s}
@keyframes fall{from{transform:translateY(-15vh) rotate(0);opacity:0}12%{opacity:.75}to{transform:translate(70px,120vh) rotate(420deg);opacity:0}}
header{text-align:center;padding:55px 18px 28px;position:relative}h1{font:800 clamp(29px,5vw,54px) Orbitron,Inter,sans-serif;letter-spacing:2px;margin:0;background:linear-gradient(90deg,#39b8ff,#8560ff,#ff74c8);-webkit-background-clip:text;color:transparent}
main{width:min(1160px,92%);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:55px}
.card{position:relative;overflow:hidden;padding:28px;border:1px solid #ffffff14;border-radius:28px;background:#ffffff07;backdrop-filter:blur(16px);box-shadow:0 22px 80px #0009;transition:.3s}
.card:hover{transform:translateY(-4px);border-color:#ffffff28}.card:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-135px;top:-145px;background:radial-gradient(circle,var(--main),transparent 68%);filter:blur(45px);opacity:.13}
.card:after{content:"";position:absolute;width:230px;height:120px;border-radius:50%;left:50%;bottom:-74px;transform:translateX(-50%);background:radial-gradient(ellipse,var(--cross),transparent 70%);filter:blur(38px);opacity:.08;pointer-events:none}
.ali{--main:#39b8ff;--cross:#ff74c8}.neko{--main:#ff74c8;--cross:#39b8ff}
.top{display:flex;align-items:center;gap:17px;margin-bottom:24px;position:relative;z-index:1}.avatar{width:82px;height:82px;border-radius:24px;overflow:hidden;flex:none;border:1px solid #ffffff24;box-shadow:0 0 32px #0007;background:linear-gradient(135deg,var(--main),#7658ff)}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{font:700 20px Orbitron,Inter,sans-serif}.role{margin-top:7px;color:#aaa8bd;font-size:11px;letter-spacing:1.6px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}.link{min-width:0;display:flex;align-items:center;gap:10px;padding:12px 13px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff05;color:#f1effa;text-decoration:none;font-size:12.5px;font-weight:600;transition:.22s;white-space:nowrap}.link:hover{background:#ffffff0d;border-color:#ffffff25;transform:translateX(3px)}
.icon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--main),#7658ff);color:white}.icon svg{width:17px;height:17px;display:block}
.fa{font-family:Vazirmatn,Segoe UI,Tahoma,sans-serif;color:#c9c5d8;font-weight:500}
footer{text-align:center;color:#666477;font-size:10px;padding:0 20px 28px}
@media(max-width:760px){header{padding-top:38px}main{grid-template-columns:1fr;width:min(560px,92%)}.card{padding:22px;border-radius:23px}.links{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"></div><div class="petals"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<header><h1 id="title">ALIZOVOX × NEKOHIRAN</h1></header>
<main id="app"></main><footer>© 2026</footer>
<script>
const icons={
Instagram:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.7" r="1.2" fill="currentColor"/></svg>',
YouTube:'<svg viewBox="0 0 24 24"><path d="M21 8.2a2.8 2.8 0 0 0-2-2C17.3 5.7 12 5.7 12 5.7s-5.3 0-7 .5a2.8 2.8 0 0 0-2 2C2.5 9.9 2.5 12 2.5 12s0 2.1.5 3.8a2.8 2.8 0 0 0 2 2c1.7.5 7 .5 7 .5s5.3 0 7-.5a2.8 2.8 0 0 0 2-2c.5-1.7.5-3.8.5-3.8s0-2.1-.5-3.8Z" fill="currentColor"/><path d="m10 9 5 3-5 3V9Z" fill="#05050b"/></svg>',
Aparat:'<svg viewBox="0 0 24 24"><path d="M12 3 4 7v6c0 4.4 3.1 7.1 8 8 4.9-.9 8-3.6 8-8V7l-8-4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 13.1h7.6M9.3 10.3h5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
Kick:'<svg viewBox="0 0 24 24"><path d="M5 3v18h4v-6l5 6h5l-7-8 7-7h-5l-5 5V3H5Z" fill="currentColor"/></svg>',
Discord:'<svg viewBox="0 0 24 24"><path d="M5 5.5C8.2 3.7 15.8 3.7 19 5.5c1.1 2.3 1.7 5 1.3 8-1.8 1.6-3.7 2.5-5.8 3.1l-1.2-1.6c-.9.2-1.8.3-2.7.3s-1.8-.1-2.7-.3l-1.2 1.6c-2.1-.6-4-1.5-5.8-3.1-.4-3 .2-5.7 1.3-8Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10.5" r="1.4" fill="currentColor"/><circle cx="15" cy="10.5" r="1.4" fill="currentColor"/></svg>',
Telegram:'<svg viewBox="0 0 24 24"><path d="m20.5 4.2-3 15.1c-.2 1.1-.8 1.4-1.7.9l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L5.3 12.9.6 11.4c-1-.3-1-1 .2-1.5L19.2 3.6c.9-.3 1.6.2 1.3.6Z" fill="currentColor"/></svg>',
Donate:'<svg viewBox="0 0 24 24"><path d="M12 3v18M16 7.2c-.9-.8-2.2-1.2-3.7-1.2-2.3 0-3.8 1.1-3.8 2.8 0 4.2 7.8 1.8 7.8 5.7 0 1.7-1.5 2.9-4 2.9-1.8 0-3.3-.5-4.3-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};
function card(person){
 return `<section class="card ${person===window.cfg.ali?'ali':'neko'}">
 <div class="top"><div class="avatar"><img src="${person.image}" alt="${person.name}"></div><div><div class="name">${person.name}</div><div class="role">${person.role}</div></div></div>
 <div class="links">${person.links.map(x=>`<a class="link" href="${x[2]}" target="_blank" rel="noopener"><span class="icon">${icons[x[0]]||''}</span><span>${x[0]} <span class="fa">· ${x[1]}</span></span></a>`).join('')}</div></section>`;
}
fetch('config.json').then(r=>r.json()).then(cfg=>{window.cfg=cfg;document.title=cfg.title;document.getElementById('title').textContent=cfg.title.toUpperCase();document.getElementById('app').innerHTML=card(cfg.ali)+card(cfg.neko)}).catch(()=>document.getElementById('app').innerHTML='<p style="text-align:center;color:#aaa">config.json پیدا نشد.</p>');
</script>
</body></html>
